  <text x="90" y="102" fill="#F2F8FF" font-family="Menlo, Monaco, monospace" font-size="54" font-weight="700">Source To Metric Pipeline</text>
  <text x="94" y="148" fill="#A9BCD8" font-family="Menlo, Monaco, monospace" font-size="24">How reference evidence becomes a reviewable release claim.</text>

  <g font-family="Menlo, Monaco, monospace">

      <text x="24" y="100" fill="#F4EDFF" font-size="19">labels, timing,</text>
      <text x="24" y="130" fill="#F4EDFF" font-size="19">path controls,</text>
      <text x="24" y="160" fill="#F4EDFF" font-size="19">cue roles</text>
    </g>
    <path d="M898 369H974" stroke="#82D9FF" stroke-width="5" marker-end="url(#arrow)"/>

    <text x="206" y="681" fill="#F2F8FF" font-size="30" font-weight="700">Release claim</text>
    <text x="206" y="725" fill="#D8E8FF" font-size="22">A claim can move to docs, dashboards, beta, or production only when the evidence path is inspectable.</text>
    <text x="206" y="756" fill="#D8E8FF" font-size="22">If proof is private-boundary, this paper may still use it when the owner explicitly approves that use.</text>
  </g>
  <text x="90" y="832" fill="#91A8C8" font-family="Menlo, Monaco, monospace" font-size="20">White-paper illustration · first-party SVG · June 2026 status pass</text>

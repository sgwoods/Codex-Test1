name: Release Contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Runtime ancestry tests require more than the default shallow checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test fast development and release contracts with isolated fixtures
        run: npm test
      - name: Test controller parity with source-backed simulations
        run: npm run test:sim
      - name: Retain development test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-test-receipts
          path: harness-artifacts/test-runs/
          if-no-files-found: warn

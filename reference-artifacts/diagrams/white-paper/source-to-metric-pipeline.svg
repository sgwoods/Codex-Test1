      <text x="24" y="100" fill="#EAF3FF" font-size="19">video, manual,</text>
      <text x="24" y="130" fill="#EAF3FF" font-size="19">audio, sprite,</text>
      <text x="24" y="160" fill="#EAF3FF" font-size="19">run log, package</text>
    </g>
    <path d="M294 369H370" stroke="#82D9FF" stroke-width="5" marker-end="url(#arrow)"/>

      <text x="24" y="54" fill="#9AF7C5" font-size="27" font-weight="700">2. Window</text>
      <text x="24" y="100" fill="#EAF3FF" font-size="19">clip, frame, crop,</text>
      <text x="24" y="130" fill="#EAF3FF" font-size="19">waveform, track,</text>
      <text x="24" y="160" fill="#EAF3FF" font-size="19">contact sheet</text>
